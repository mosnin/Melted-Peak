# Skill Index
# Central registry of all skills available to the system.
# The context compiler reads this to find relevant skills for a task.
#
# Entry format:
#   - name: skill-name
#     path: skills/skill-name/
#     status: draft | ready | deprecated | superseded
#     context_cost: small | medium | large
#     tags: [tag1, tag2]
#     triggers: [condition1, condition2]
#     description: One-line summary

skills:
  - name: context-boot
    path: skills/context-boot/
    status: ready
    context_cost: small
    tags: [system, boot, context]
    triggers: [session-start]
    description: Boot the Melted Peak context system at session start

  - name: debugging
    path: skills/debugging/
    status: ready
    context_cost: small
    tags: [debugging, bug-fix, diagnosis, workflow]
    triggers: [bug-reported, test-failure, regression-detected, work-type-bug-fix]
    description: Systematic bug diagnosis and fix workflow with circular-debugging prevention

  - name: code-review
    path: skills/code-review/
    status: ready
    context_cost: small
    tags: [review, quality, safety, workflow]
    triggers: [pre-commit, user-request-review, change-plan-completed, validation]
    description: Structured code review checking correctness, safety, consistency, and regressions

  - name: dependency-update
    path: skills/dependency-update/
    status: ready
    context_cost: small
    tags: [dependencies, maintenance, security, workflow]
    triggers: [dependency-update, security-vulnerability, work-type-maintenance]
    description: Safe dependency update workflow with changelog review, risk assessment, and rollback

  - name: skill-router
    path: skills/skill-router/
    status: ready
    context_cost: medium
    tags: [meta, skill-creation, workflow, system, patterns]
    triggers: [user-command-new-skill, repeated-workflow-detected, retrospective, pattern-identified]
    description: Meta-skill that detects workflow patterns and guides creation of new project-specific skills

  - name: project-kickoff
    path: skills/project-kickoff/
    status: ready
    context_cost: medium
    tags: [kickoff, prd, interview, discovery, planning, onboarding]
    triggers: [new-project, user-command-kickoff, no-prd-exists]
    description: Structured interview that produces a PRD and seeds the Melted Peak memory system
