# Skill Index
# Central registry of all skills available to the system.
# The context compiler reads this to find relevant skills for a task.
#
# Entry format:
#   - name: skill-name
#     path: skills/skill-name/
#     status: draft | ready | deprecated | superseded
#     context_cost: small | medium | large
#     tags: [tag1, tag2]
#     triggers: [condition1, condition2]
#     description: One-line summary

skills:
  - name: context-boot
    path: skills/context-boot/
    status: ready
    context_cost: small
    tags: [system, boot, context]
    triggers: [session-start]
    description: Boot the Melted Peak context system at session start

  - name: debugging
    path: skills/debugging/
    status: ready
    context_cost: small
    tags: [debugging, bug-fix, diagnosis, workflow]
    triggers: [bug-reported, test-failure, regression-detected, work-type-bug-fix]
    description: Systematic bug diagnosis and fix workflow with circular-debugging prevention

  - name: code-review
    path: skills/code-review/
    status: ready
    context_cost: small
    tags: [review, quality, safety, workflow]
    triggers: [pre-commit, user-request-review, change-plan-completed, validation]
    description: Structured code review checking correctness, safety, consistency, and regressions

  - name: dependency-update
    path: skills/dependency-update/
    status: ready
    context_cost: small
    tags: [dependencies, maintenance, security, workflow]
    triggers: [dependency-update, security-vulnerability, work-type-maintenance]
    description: Safe dependency update workflow with changelog review, risk assessment, and rollback

  - name: skill-router
    path: skills/skill-router/
    status: ready
    context_cost: medium
    tags: [meta, skill-creation, workflow, system, patterns]
    triggers: [user-command-new-skill, repeated-workflow-detected, retrospective, pattern-identified]
    description: Meta-skill that detects workflow patterns and guides creation of new project-specific skills

  - name: project-kickoff
    path: skills/project-kickoff/
    status: ready
    context_cost: medium
    tags: [kickoff, prd, interview, discovery, planning, onboarding]
    triggers: [new-project, user-command-kickoff, no-prd-exists]
    description: Structured interview that produces a PRD and seeds the Melted Peak memory system

  - name: retrospective
    path: skills/retrospective/
    status: ready
    context_cost: small
    tags: [meta, self-improvement, feedback, quality, metrics]
    triggers: [issue-resolved, feature-completed, user-command-retro, three-strike-invoked]
    description: Post-completion analysis that feeds lessons back into skills, protocols, and context profiles

  - name: peak-manager
    path: skills/peak-manager/
    status: ready
    context_cost: medium
    tags: [peaks, import, mount, system, meta, integration]
    triggers: [user-command-peak, peak-import, peak-mount, peak-unmount]
    description: Import, mount, unmount, and manage peaks -- comprehensive domain sub-systems

  # --- Peak-provided skills ---

  - name: modaf-saas/saas-phase-workflow
    path: peaks/modaf-saas/skills/saas-phase-workflow/
    status: ready
    context_cost: small
    tags: [saas, phases, build, workflow, orchestration]
    triggers: [saas-project-start, phase-resume, phase-advance, work-type-saas-phase-build]
    description: Orchestrate the 15-phase Modaf SaaS build process with phase detection and validation
    peak: modaf-saas

  - name: modaf-saas/modaf-doctor
    path: peaks/modaf-saas/skills/modaf-doctor/
    status: ready
    context_cost: small
    tags: [saas, diagnostics, doctor, health-check]
    triggers: [user-request-doctor, framework-health-check]
    description: Diagnostic and repair system for Modaf framework and project docs
    peak: modaf-saas

  # --- Batch 2 skills ---

  - name: git-workflow
    path: skills/git-workflow/
    status: ready
    context_cost: small
    tags: [git, workflow, commits, branches, pr, version-control]
    triggers: [pre-commit, branch-creation, pr-creation, change-plan-execution]
    description: Structured git workflow with branch naming, commit discipline, and PR practices

  - name: refactoring
    path: skills/refactoring/
    status: ready
    context_cost: small
    tags: [refactoring, code-quality, restructuring, workflow, incremental]
    triggers: [work-type-refactor, code-review-structural-issue, tech-debt-cleanup]
    description: Safe incremental refactoring with atomic transformations and verification between each step

  - name: testing-strategy
    path: skills/testing-strategy/
    status: ready
    context_cost: small
    tags: [testing, quality, coverage, unit-tests, integration, e2e, workflow]
    triggers: [writing-tests, validation-plan, coverage-evaluation, new-feature-testing]
    description: Test planning and execution guide -- what to test, which type, how to structure, coverage

  - name: performance-analysis
    path: skills/performance-analysis/
    status: ready
    context_cost: small
    tags: [performance, profiling, optimization, bottleneck, measurement, workflow]
    triggers: [performance-issue, pre-launch-audit, hot-path-change, performance-requirements]
    description: Systematic performance investigation -- profiling, bottleneck identification, measurement

  # --- Batch 3 skills (critical + high priority) ---

  - name: deployment-workflow
    path: skills/deployment-workflow/
    status: ready
    context_cost: small
    tags: [deployment, ci-cd, rollback, production, release, workflow]
    triggers: [work-type-deployment, pre-deploy, release, production-push]
    description: Pre-deploy validation, deployment execution, post-deploy verification, and rollback procedures

  - name: api-design
    path: skills/api-design/
    status: ready
    context_cost: small
    tags: [api, rest, endpoints, contracts, versioning, documentation]
    triggers: [api-creation, endpoint-design, api-change, work-type-api-design]
    description: API contract design, endpoint planning, versioning, error codes, and documentation

  - name: database-migrations
    path: skills/database-migrations/
    status: ready
    context_cost: small
    tags: [database, migrations, schema, data-integrity, rollback]
    triggers: [schema-change, migration-needed, database-update]
    description: Schema change planning, migration safety, rollback procedures, and data integrity

  - name: security-audit
    path: skills/security-audit/
    status: ready
    context_cost: small
    tags: [security, audit, vulnerability, owasp, secrets, authentication]
    triggers: [work-type-security, pre-launch-audit, security-review, vulnerability-found]
    description: OWASP checklist, dependency scanning, secrets detection, auth review, data protection

  - name: documentation-generation
    path: skills/documentation-generation/
    status: ready
    context_cost: small
    tags: [documentation, readme, api-docs, adr, changelog, workflow]
    triggers: [work-type-documentation, readme-needed, api-docs-needed, adr-creation]
    description: README, API docs, ADRs, changelogs, contributing guides, and doc maintenance

  - name: error-handling-design
    path: skills/error-handling-design/
    status: ready
    context_cost: small
    tags: [errors, error-handling, resilience, retry, logging, graceful-degradation]
    triggers: [error-design, error-handling-review, resilience-planning]
    description: Error classification, retry patterns, graceful degradation, logging strategy, user feedback

  - name: technical-debt-assessment
    path: skills/technical-debt-assessment/
    status: ready
    context_cost: small
    tags: [technical-debt, code-quality, assessment, prioritization, maintenance]
    triggers: [tech-debt-review, code-quality-assessment, maintenance-planning]
    description: Debt identification, classification, cost-benefit analysis, prioritization, and paydown strategies

  # --- Batch 4 skills ---

  - name: incident-response
    path: skills/incident-response/
    status: ready
    context_cost: small
    tags: [incident, production, response, triage, rollback, postmortem]
    triggers: [production-incident, outage, error-spike, user-reported-issue]
    description: Production incident response -- severity classification, triage, mitigation, post-incident review

  - name: codebase-onboarding
    path: skills/codebase-onboarding/
    status: ready
    context_cost: small
    tags: [onboarding, codebase, learning, exploration, architecture, conventions]
    triggers: [work-type-onboarding, new-codebase, first-session, project-join]
    description: Structured codebase onboarding -- architecture mapping, convention discovery, mental model creation

  - name: code-generation
    path: skills/code-generation/
    status: ready
    context_cost: small
    tags: [code-generation, scaffolding, patterns, conventions, templates]
    triggers: [new-component, new-endpoint, new-model, scaffolding, feature-build]
    description: Structured code generation -- pattern matching, convention enforcement, post-generation verification
