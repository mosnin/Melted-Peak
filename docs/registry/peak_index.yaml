# Peak Index
# Central registry of all peaks available to the system.
# The context compiler and peak manager read this to manage peaks.
#
# Entry format:
#   - name: peak-name
#     path: peaks/peak-name/
#     version: "1.0.0"
#     status: draft | ready | unmounted | deprecated | superseded
#     domain: frontend | backend | fullstack | agents | devops | mobile | data | security
#     stack: [framework1, framework2]
#     provides:
#       skills: [skill1, skill2]
#       knowledge: [knowledge1]
#       profiles: [profile1]
#     context_cost: small | medium | large
#     description: One-line summary

peaks:
  - name: modaf-saas
    path: peaks/modaf-saas/
    version: "1.0.0"
    status: ready
    domain: fullstack
    stack: [nextjs, typescript, prisma, stripe, tailwind]
    provides:
      skills: [modaf-saas/saas-phase-workflow, modaf-saas/modaf-doctor]
      knowledge: [modaf-saas/saas-internal, modaf-saas/saas-website]
      profiles: [saas-build, saas-discovery, saas-architecture, saas-marketing]
    context_cost: large
    description: Complete SaaS application framework -- 15-phase build system from discovery to polish
