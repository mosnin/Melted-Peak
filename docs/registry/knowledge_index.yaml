# Knowledge Index
# Central registry of all knowledge packs available to the system.
# The context compiler reads this to find relevant knowledge for a task.
#
# Entry format:
#   - name: knowledge-name
#     path: knowledge/knowledge-name/
#     status: draft | ready | deprecated | superseded
#     context_cost: small | medium | large
#     domain: primary-domain
#     tags: [tag1, tag2]
#     description: One-line summary

knowledge:
  # --- Peak-provided knowledge ---

  - name: modaf-saas/saas-internal
    path: peaks/modaf-saas/knowledge/saas-internal/
    status: ready
    context_cost: large
    domain: fullstack
    tags: [saas, internal, auth, dashboard, features, data-models, ui, build-rules, prisma, nextjs]
    description: Internal SaaS app reference -- 28 docs covering auth, dashboard, features, data models, UI, build rules
    peak: modaf-saas

  - name: modaf-saas/saas-website
    path: peaks/modaf-saas/knowledge/saas-website/
    status: ready
    context_cost: medium
    domain: frontend
    tags: [saas, website, marketing, landing-page, conversion, design-system, nextjs]
    description: SaaS marketing website reference -- 9 docs covering home page, page system, design tokens, components
    peak: modaf-saas

  # --- General knowledge packs ---

  - name: debugging-patterns
    path: knowledge/debugging-patterns/
    status: ready
    context_cost: small
    domain: general
    tags: [debugging, errors, patterns, techniques, diagnosis, troubleshooting]
    description: Common error patterns by category and 7 systematic debugging techniques

  - name: performance-patterns
    path: knowledge/performance-patterns/
    status: ready
    context_cost: small
    domain: general
    tags: [performance, web-vitals, caching, optimization, budgets, measurement]
    description: Web performance patterns -- Core Web Vitals, bottleneck fixes, caching, budgets
