# Active Peak Profiles
# Context compiler profile extensions provided by mounted peaks.
# Read by the context compiler AFTER built-in profiles.

extensions:
  - peak: modaf-saas
    extends: bug-fix
    add_recommended:
      - peaks/modaf-saas/knowledge/saas-internal/summary.md

  - peak: modaf-saas
    extends: new-feature
    add_required:
      - peaks/modaf-saas/conventions.md
    add_recommended:
      - peaks/modaf-saas/knowledge/saas-internal/summary.md

custom_work_types:
  - peak: modaf-saas
    work_type: saas-phase-build
    description: "Building a SaaS app phase (foundation, auth, features, etc.)"
    profile_path: peaks/modaf-saas/profiles/saas-build.yaml

  - peak: modaf-saas
    work_type: saas-discovery
    description: "SaaS product discovery and project document generation"
    profile_path: peaks/modaf-saas/profiles/saas-discovery.yaml

  - peak: modaf-saas
    work_type: saas-architecture
    description: "SaaS architecture planning -- entities, routes, modules, build order"
    profile_path: peaks/modaf-saas/profiles/saas-architecture.yaml

  - peak: modaf-saas
    work_type: saas-marketing
    description: "Building the SaaS marketing/public website"
    profile_path: peaks/modaf-saas/profiles/saas-marketing.yaml
